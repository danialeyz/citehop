[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "citehop"
version = "0.1.0"
description = "Wikipedia RAG with native MariaDB vectors and a derived Neo4j graph"
requires-python = ">=3.11,<3.12"
dependencies = [
  "mariadb==1.1.14", "python-dotenv==1.2.4", "fastapi==0.162.0",
  "uvicorn==0.54.0", "neo4j==6.4.1", "sqlparse==0.6.0",
]

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.3", "httpx==0.28.1", "build==1.6.1"]

[tool.setuptools.packages.find]
include = ["citehop*"]

[tool.pytest.ini_options]
markers = [
  "db: requires local databases",
  "neo4j: needs a disposable Neo4j in CITEHOP_TEST_NEO4J_URI (clears the CiteHop namespace)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
