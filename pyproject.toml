[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "citehop"
version = "0.1.0"
description = "Scientific paper search in MariaDB: FULLTEXT + vectors + a knowledge graph"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["citehop*"]

[tool.pytest.ini_options]
markers = [
  "db: needs a running MariaDB (make db-up)",
  "neo4j: needs a disposable Neo4j in CITEHOP_TEST_NEO4J_URI (clears the CiteHop namespace)",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
