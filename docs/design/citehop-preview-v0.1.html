fy-content:space-between;padding:0 42px;font-size:12px}.topbar strong{font-weight:400;color:var(--muted)}.top-right{display:flex;gap:18px;align-items:center}.status{border:1px solid var(--line);border-radius:30px;padding:5px 10px;font-size:11px}.dot{display:inline-block;width:6px;height:6px;background:var(--teal);border-radius:50%;margin-right:6px}.avatar{display:grid;place-items:center;background:#e1e8da;width:30px;height:30px;border-radius:50%;font-size:10px}.main{max-width:1600px;margin:auto;padding:34px 42px 45px}.eyebrow{font:10px/1.4 monospace;letter-spacing:1.7px;text-transform:uppercase;color:var(--muted)}h1,h2,h3,p{margin:0}h1{font-size:38px;line-height:1.15;letter-spacing:-1.7px;font-weight:500;margin:9px 0 12px}h2{font-size:22px;font-weight:500;letter-spacing:-.6px}h3{font-size:17px;font-weight:500;letter-spacing:-.3px}.muted{color:var(--muted)}.hero{display:grid;grid-template-columns:1.25fr 1fr;gap:30px;align-items:center;min-height:235px}.hero h1{font-size:55px;line-height:1.06;max-width:570px;letter-spacing:-2.5px}.hero p{font-size:15px;max-width:430px}.hero-art{height:245px;position:relative;overflow:hidden}.hero-art svg{width:100%;height:100%}.serif{font-family:Georgia,serif;font-style:italic;font-weight:normal}.search-panel{margin:20px 0 28px;background:var(--surface);border:1px solid var(--line);padding:22px;border-radius:var(--radius);box-shadow:var(--shadow)}.search-label{display:block;font-size:12px;font-weight:bold;margin-bottom:10px}.search-row{display:flex;gap:12px;align-items:center}.search-row input{flex:1;min-width:0;border:0;border-bottom:1px solid transparent;background:transparent;font-size:18px;padding:10px 0;color:var(--ink)}.search-row input:focus{outline:none;border-bottom-color:var(--teal)}.primary,.secondary{border-radius:8px;padding:11px 17px;border:1px solid var(--line);font-weight:bold;font-size:12px;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:12px}.primary{background:var(--teal);color d{position:absolute;bottom:18px;left:20px;display:flex;gap:12px;font-size:10px;background:#fffefaed;padding:8px;border-radius:6px}.graph-node{cursor:pointer}.graph-node:focus{outline:none}.graph-node:focus circle{stroke:#a54829;stroke-width:4}.graph-node:hover circle{stroke-width:4}.graph-caption{font-size:11px;fill:#53685e}.graph-label{font:12px Arial;fill:#193b38}.graph-path{fill:none;stroke:#b5c5b7;stroke-width:1.4}.selected-path{stroke:#115b50;stroke-width:2.5}.detail-title{font-size:34px;max-width:830px;margin:18px 0}.detail-layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:26px;margin-top:26px}.prose{font-size:15px;line-height:1.8;color:#475e55;margin:15px 0}.quote{border-left:3px solid #b1ca70;background:#f2f5e8;margin:18px 0;padding:17px;font-family:Georgia,serif;font-size:17px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}table{border-collapse:collapse;width:100%;font-size:12px;white-space:nowrap}th,td{padding:13px 16px;text-align:left;border-bottom:1px solid var(--line)}th{font-weight:normal;color:var(--muted);background:#ecefe5;font-size:10px}tr:last-child td{border-bottom:0}.ref-row{background:#eef3e2}.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:23px 0}.metric-grid .card{padding:19px}.value-empty{font-size:30px;line-height:1.6}.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}.field{display:grid;gap:8px;margin:17px 0;font-size:12px}.field input[type=range]{accent-color:var(--teal);width:100%}.field input[type=number]{padding:9px;border:1px solid var(--line);border-radius:6px;width:100%;background:var(--surface)}.toggle-line{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}input[type=checkbox]{accent-color:var(--teal);width:18px;height:18px}.empty{padding:70px 24px;text-align:center;border:1px dashed #bccbb9;border-radius:16px;background:var(--surface);margin-top:24px}.empty p{margin:12px auto 22px;max-width:410px;color:var(--muted)}.empty-symbol{font-size:38px;color:var(--teal);margin-bottom:15px}.reviewbar{margin-top:28px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:10px}.reviewbar a{padding:4px}.toast{position:fixed;right:25px;bottom:25px;max-width:360px;border-radius:10px;padding:16px;background:var(--ink);color:white;z-index:10}.skeleton{height:18px;background:#e7ecdf;border-radius:5px;margin:16px 0;width:80%;animation:pulse 1.2s infinite alternate}@keyframes pulse{to{opacity:.4}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.example:hover{transform:none}}@media(min-width:1600px){.main{padding-top:45px}.hero{min-height:290px}}@media(max-width:1100px){.sidebar{width:180px;padding:25px 14px}.shell{grid-template-columns:180px 1fr}.main{padding:28px}.topbar{padding:0 28px}.hero h1{font-size:44px}.results-layout,.detail-layout{grid-template-columns:1fr 250px}.graph-layout{grid-template-columns:1fr}.graph-layout .stack{grid-template-columns:1fr 1fr}.grid3{gap:10px}.card{padding:19px}}@media(max-width:760px){.shell{display:block}.sidebar{position:relative;width:100%;padding:16px 20px;display:block}.brand{font-size:23px}.brand svg{width:28px}.wordmark-sub,.sidebar-foot{display:none}.nav{display:flex;overflow:auto;margin-top:15px;gap:5px}.nav a{padding:8px 10px;font-size:11px;white-space:nowrap}.nav-icon{display:none}.topbar{height:52px;padding:0 20px}.top-right .status,.avatar{display:none}.main{padding:25px 20px}.hero{display:block;min-height:0}.hero h1{font-size:43px}.hero-art{height:160px;margin-top:10px}.search-panel{padding:17px;margin-top:18px}.search-row{flex-wrap:wrap}.search-row input{flex-basis:100%;font-size:16px}.search-row .primary{width:100%}.search-options{align-items:flex-start;flex-direction:column}.grid3,.results-layout,.detail-layout,.settings-grid{grid-template-columns:1fr}.example{min-height:135px}.numbers{gap:12px}.nu </style></head><body><a class="skip" href="#main">Skip to content</a><div id="app"></div><script>const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const params=new URLSearchParams(location.search);let mode='CiteHop',query=params.get('q')||'How can citation graphs improve scientific paper retrieval?';
const logo=`<svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M9 27L19 10L31 23L9 27" stroke="currentColor" stroke-width="2"/><circle cx="9" cy="27" r="5" fill="#d5ed91"/><circle cx="19" cy="10" r="5" fill="#d5ed91"/><circle cx="31" cy="23" r="5" fill="#d5ed91"/></svg>`;
const routes=[['search','⌕','Search papers'],['graph','⌘','Graph explorer'],['experiments','▥','Experiments'],['settings','⚙','Search settings']];
const papers=[{title:'Learning to retrieve scientific papers through citation neighborhoods',year:'2024',author:'A. Researcher · B. Researcher',tags:['kw','vec','cite'],abstract:'An illustrative paper about combining text representations with citation neighborhoods to retrieve relevant scientific work.'},{title:'Beyond text similarity: graph expansion for literature search',year:'2023',author:'C. Researcher · D. Researcher',tags:['cite','concept'],abstract:'An illustrative result reached through a citation and a shared concept. It demonstrates how a graph-only discovery could be explained.'},{title:'Dense representations for scientific document retrieval',year:'2022',author:'E. Researcher · F. Researcher',tags:['kw','vec'],abstract:'An illustrative result about meaning-based retrieval. Its labels show that more than one retrieval method may find the same paper.'}];
const chipNames={kw:'Keyword',vec:'Meaning',cite:'Citation',concept:'Concept',author:'Author'};
function chips(tags){return `<div class="chips">${tags.map(t=>`<span class="chip ${t}">${chipNames[t]}</span>`).join('')}</div>`}
function graph(hero=false){return `<svg viewBox="0 0 760 490" role="img" aria-label="Illustrative graph: seed paper connects to cited papers, a concept and an author"><g class="graph-path"><path class="selected-path" d="M320 245L520 155L590 320"/><path d="M320 245L145 130M320 245L155 350M320 245L405 410M145 130L70 260M520 155L650 70M520 155L700 220M155 350L70 260M405 410L590 320M320 245L360 65"/></g>${[[320,245,33,'Seed paper','paper'],[520,155,24,'Citation neighbor','paper'],[590,320,23,'Graph discovery','paper'],[145,130,22,'Dense retrieval','concept'],[155,350,22,'A. Researcher','author'],[405,410,15,'Shared reference','paper'],[70,260,12,'Related paper','paper'],[650,70,12,'Related paper','paper'],[700,220,13,'Related paper','paper'],[360,65,14,'Retrieval task','concept']].map(([x,y,r,l,t],i)=>`<g ${hero?'':`class="graph-node" role="button" tabindex="0" data-node="${i}" aria-label="Inspect ${l}"`}><circle cx="${x}" cy="${y}" r="${r+7}" fill="${i===0?'#e0e9d2':'transparent'}"/><circle cx="${x}" cy="${y}" r="${r}" fill="${t==='concept'?'#f0d9b4':t==='author'?'#bdcee2':i===0?'#115b50':'#d0e1ba'}" stroke="${t==='concept'?'#af8241':t==='author'?'#6c8aaa':'#6d9663'}"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="${r>20?14:9}" fill="${i===0?'#fff':'#224e3b'}">${t==='concept'?'◇':t==='author'?'A':'▤'}</text>${r>18?`<text x="${x}" y="${y+r+25}" text-anchor="middle" class="graph-label">${l}</text>`:''}</g>`).join('')}<text x="414" y="182" class="graph-caption">cites →</text><text x="552" y="235" class="graph-caption">cites ↓</text></svg>`}
function searchBox(compact=false){return `<form class="search-panel" id="search-form"><label class="search-label" for="query">${compact?'Your research question':'What are you researching?'}</label><div class="search-row"><input id="query" name="q" required maxlength="2000" placeholder="Ask a question, or enter keywords…" value="${compact?esc(query):''}"><button class="primary" type="submit">Find papers <span>↗</span></button></div><div class="search-options"><div class="segmented" aria-label="Retrieval method">${['Keyword','Meaning','Fused','CiteHop'].map(m=>`<button type="button" data-mode="${m}" class="${m===mode?'selected':''}" aria-pressed="${m===mode}">${m}</button>`).join('')}</div><span class="small muted" id="method-hint">${mode==='CiteHop'?'Text + meaning + graph links':'Selected method: '+mode}</span></div></form>`}
function home(){return `<section class="hero"><div><div class="eyebrow">Scientific paper discovery</div><h1>Follow the evidence.<br>Find the <span class="serif">connection.</span></h1><p class="muted">Search beyond matching words. Explore the papers, people, and ideas that connect your research.</p></div><div class="hero-art">${graph(true)}</div></section>${searchBox()}<div class="section-head"><h2>A good question opens a new path.</h2><span class="eyebrow">Try a sample question</span></div><div class="grid3">${[['01 / Citations','How can citation graphs improve scientific paper retrieval?'],['02 / Concepts','Which methods connect dense retrieval and contrastive learning?'],['03 / Authors','How can shared authors help discover related papers?']].map(([l,q])=>`<button class="card example" data-example="${q}"><span class="eyebrow">${l}</span><p>${q}</p><span class="arrow">↗</span></button>`).join('')}</div><div class="numbers"><div><div class="big-num">64,183</div><div class="small muted">Papers · expected corpus size</div></div><div><div class="big-num">597</div><div class="small muted">Questions · expected benchmark size</div></div><div><div class="big-num">One database.</div><div class="small muted">Text, vectors, and graph in MariaDB</div></div></div>`}
function results(){return `<div class="eyebrow">Search workspace</div><div class="heading-row"><h1>Follow your question.</h1><a class="secondary" href="#graph">Open graph ↗</a></div>${searchBox(true)}<div class="results-layout"><section><div class="section-head" style="margin-top:0"><h2>Relevant papers <span class="small muted">/ 3 illustrative results</span></h2><span class="small muted">Ranked by ${esc(mode)}</span></div>${papers.map((p,i)=>`<article class="paper ${i===1?'highlight':''}"><div class="rank">0${i+1}</div><div>${i===1?'<div class="eyebrow" style="margin-bottom:8px">A connection beyond text</div>':''}<h3><a href="#paper-${i}">${p.title}</a></h3><div class="metadata">${p.author} &nbsp; · &nbsp; ${p.year} &nbsp; · &nbsp; Fictional sample</div>${chips(p.tags)}<p>${p.abstract}</p><div class="paper-bottom"><span class="muted">${i===1?'Outside keyword and meaning candidate sets in this fixture':'Multiple retrieval signals in this fixture'}</span><a href="#paper-${i}" class="text-link">Why this paper? ↗</a></div></div></article>`).join('')}<div class="note">Illustrative ranking and provenance. No live search has run. Production returns up to 20 papers.</div></section><aside class="stack"><div class="card"><div class="eyebrow">Behind the results</div><h2 style="margin-top:9px">One query.<br>Connected evidence.</h2><div class="pipeline"><div><b>01 · Retrieve</b><span>MariaDB full-text + meaning</span></div><div><b>02 · Fuse</b><span>Reciprocal rank fusion</span></div><div><b>03 · Explore</b><span>Citations, concepts, authors</span></div><div><b>04 · Rerank</b><span>Weighted score → top 20</span></div></div></div><div class="card"><div class="eyebrow">Research question</div><p style="font-family:Georgia;font-size:19px;margin-top:12px">What can graph links find that words and meaning miss?</p><a href="#experiments" class="text-link" style="display:block;margin-top:20px">Inspect the experiment plan ↗</a></div></aside></div>`}
function graphPage(){return `<div class="eyebrow">Knowledge graph / illustrative neighborhood</div><div class="heading-row"><h1>Every paper has a neighborhood.</h1><a class="secondary" href="#results">Back to results</a></div><p class="page-desc">Trace citations, shared concepts, and authors. Select a node to inspect its connection.</p><div class="toolbar"><label for="hops">Depth</label><select id="hops"><option value="1">1 hop</option><option value="2" selected>2 hops · sample</option></select><span class="chip cite">Paper</span><span class="chip concept">Concept</span><span class="chip author">Author</span><span class="small muted">Bounded neighborhood · illustrative nodes</span></div><div class="graph-layout"><div class="graph-canvas">${graph()}<div class="graph-legend"><span>● Paper</span><span>◇ Concept</span><span>A Author</span><span>→ Directed relation</span></div></div><aside class="stack"><div class="card" id="node-detail"><div class="eyebrow">Selected node / paper</div><h2 style="margin-top:12px">Graph discovery</h2><p class="muted small" style="margin:14px 0">A fictional result reached from the seed through a citation neighbor.</p>${chips(['cite'])}<div class="score-row"><span>Path length</span><b>2 hops</b></div><div class="score-row"><span>Edge type</span><b>cites</b></div><a class="primary" style="margin-top:20px" href="#paper-1">Inspect paper ↗</a></div><div class="card"><div class="eyebrow">Readable path</div><div class="pipeline"><div><b>Seed paper</b><span>cites ↓</span></div><div><b>Citation neighbor</b><span>cites ↓</span></div><div><b>Graph discovery</b><span>Sample paper</span></div></div></div></aside></div><details class="card" style="margin-top:16px"><summary>View accessible connection list</summary><p style="margin-top:12px">Seed paper → cites → Citation neighbor → cites → Graph discovery.<br>Seed paper → uses → Dense retrieval.<br>Seed paper → written_by → A. Researcher.</p></details>`}
function paperPage(i){const p=papers[i]||papers[0];return `<a href="#results" class="text-link">← Back to search results</a><div style="margin-top:25px" class="eyebrow">Paper detail / fictional sample</div><h1 class="detail-title">${p.title}</h1><p class="muted">${p.author} &nbsp; · &nbsp; ${p.year} &nbsp; · &nbsp; Venue not available</p><div style="margin-top:18px">${chips(p.tags)}</div><div class="detail-layout"><section><div class="card"><h2>Abstract</h2><p class="prose">${p.abstract} The example investigates how connections between papers can complement lexical and semantic candidates. Citation structure provides a route to work that may use different language for a related research problem.</p><p class="small muted">This abstract was written only for the design prototype. It is not a published paper or extraction result.</p></div><div class="card" style="margin-top:18px"><div class="section-head" style="margin-top:0"><h2>Concept evidence</h2><span class="chip concept">uses · method</span></div><h3>Dense retrieval</h3><blockquote class="quote">“connections between papers can complement lexical and semantic candidates”</blockquote><p class="small muted">Illustrative quotation from this sample abstract. Production concepts require exact quoted evidence from the stored abstract.</p></div></section><aside class="stack"><div class="card"><div class="eyebrow">Retrieval provenance</div><h2 style="margin:10px 0">Why this paper?</h2><p class="muted" style="font-size:13px">${i===1?'Reached through graph expansion. This fixture marks it absent from the keyword and vector candidate sets.':'Present in the keyword and meaning candidate sets, with all available retrieval signals preserved.'}</p><div class="score-row"><span>Final score</span><b>Not computed</b></div><div class="score-row"><span>Signal contributions</span><b>Unavailable</b></div><a class="primary" href="#graph" style="margin-top:18px">Explore connections ↗</a></div><div class="card"><h3>Paper metadata</h3><div class="score-row"><span>Corpus ID</span><span>Fixture only</span></div><div class="score-row"><span>Citations received</span><span>Unknown</span></div><div class="score-row"><span>Full text URL</span><span>Not supplied</span></div></div></aside></div>`}
function experiments(){return `<div class="eyebrow">Evaluation workspace</div><div class="heading-row"><h1>Does the graph make a difference?</h1><button class="secondary" id="download-plan">Export plan ↓</button></div><p class="page-desc">Compare 12 configurations against the LitSearch answer key. Tune on development data. Report on held-out test data.</p><div class="toolbar"><label for="split">Dataset split</label><select id="split"><option value="dev">Development · tuning</option><option value="test">Test · reporting only</option></select><span class="small muted" id="split-note">Stratified 20/80 split · seed 42</span></div><div class="metric-grid">${[['Recall@5','Specific questions'],['Recall@20','Broad questions'],['nDCG@10','Ranking quality'],['MRR','First relevant result']].map(([a,b])=>`<div class="card"><div class="eyebrow">${a}</div><div class="value-empty">—</div><div class="small muted">${b} · no run</div></div>`).join('')}</div><div class="section-head"><h2>Ablation study <span class="small muted">/ A–L</span></h2><span class="chip">Awaiting configuration definitions</span></div><div class="table-wrap"><table><caption class="small muted" style="text-align:left;padding:12px 16px">No measured results. Config C is the comparison reference specified by the handout.</caption><thead><tr><th>CONFIG</th><th>DEFINITION</th><th>RECALL@5</th><th>RECALL@20</th><th>nDCG@10</th><th>MRR</th><th>STATE</th></tr></thead><tbody>${'ABCDEFGHIJKL'.split('').map(c=>`<tr class="${c==='C'?'ref-row':''}"><td><b>${c}</b> ${c==='C'?'<span class="chip">Reference</span>':''}</td><td>Not supplied in handout</td><td>—</td><td>—</td><td>—</td><td>—</td><td><span class="muted">Not run</span></td></tr>`).join('')}</tbody></table></div><div class="grid3" style="margin-top:18px"><div class="card"><h3>Found only via graph</h3><p class="muted small" style="margin-top:10px">No measurement. Requires candidate-set provenance and relevant-paper membership.</p></div><div class="card"><h3>Latency · p50 / p95</h3><p class="muted small" style="margin-top:10px">No measurement. Compare only matching run settings and hardware.</p></div><div class="card"><h3>Uncertainty matters</h3><p class="muted small" style="margin-top:10px">Paired bootstrap: 1,000 resamples. 95% interval against config C.</p></div></div>`}
function settings(){return `<div class="eyebrow">Search settings / proposed controls</div><h1>Make every signal explicit.</h1><p class="page-desc">Inspect the search parameters before a development run. Final weight semantics and tuning choices must come from the project cards.</p><form id="settings-form"><div class="settings-grid"><section class="card"><h2>Reranking weights</h2><p class="small muted" style="margin-top:10px">Prototype values mirror the function signature. Signal names are unresolved.</p>${[['a',.7],['b',.2],['c',.1]].map(([n,v])=>`<label class="field" for="weight-${n}">Parameter ${n}<input type="number" id="weight-${n}" name="${n}" min="0" max="1" step="0.05" value="${v}"></label>`).join('')}</section><section class="card"><h2>Graph expansion</h2><label class="field" for="setting-hops">Hop limit<select id="setting-hops"><option>1</option><option>2</option></select></label><div class="toggle-line"><label for="weighted">Weighted links</label><input id="weighted" type="checkbox" checked></div><div class="toggle-line"><label for="damp">Damping</label><input id="damp" type="checkbox" checked></div><div class="toggle-line"><label for="prior">Prior</label><input id="prior" type="checkbox"></div><div class="note">The 1–2 hop selector is a proposed UI limit. The backend must enforce a finite depth limit for every recursive query.</div></section><section class="card"><h2>Meaning search</h2><div class="score-row"><span>Embedding model</span><b>bge-base-en-v1.5</b></div><div class="score-row"><span>Dimensions</span><b>768</b></div><div class="score-row"><span>Distance</span><b>Cosine</b></div><p class="small muted" style="margin-top:12px">Read-only model information. Prefix selection is a later development decision.</p></section><section class="card"><h2>Research guardrails</h2><p class="prose" style="font-size:13px">Tune on the development split only. Test runs use frozen configurations and report results without tuning controls.</p><p class="small muted">No configuration will be written to a database by this prototype.</p></section></div><div class="toolbar"><button class="primary" type="submit">Preview settings</button><button class="secondary" type="reset">Reset defaults</button><span class="small muted" id="settings-status" role="status"></span></div></form>`}
function statePage(state){const states={empty:['⌕','No papers found for this question.','Try fewer terms or switch retrieval methods. Keep your question so you can refine it.'],error:['!','Search could not finish.','The database or retrieval service is unavailable. Your question and settings are preserved.'],loading:['◌','Following the evidence…','Retrieving candidates, fusing ranks, and checking graph connections.'],missing:['◇','No connections available yet.','This paper has no loaded graph links. You can still inspect its metadata and abstract.']};let [icon,title,desc]=states[state];return `<div class="eyebrow">Search workspace / ${state} state</div>${searchBox(true)}<div class="empty" role="${state==='error'?'alert':'status'}"><div class="empty-symbol">${icon}</div><h2>${title}</h2><p>${desc}</p>${state==='loading'?'<div class="skeleton" style="margin:20px auto;width:60%"></div><div class="skeleton" style="margin:20px auto;width:40%"></div>':''}<a class="secondary" href="${state==='missing'?'#paper-0':state==='error'?'#results':'#search'}">${state==='loading'?'Cancel search':state==='error'?'Retry sample search':state==='missing'?'View paper':'Edit question'}</a></div>`}
function render(){let route=location.hash.slice(1)||'search';const page=route.startsWith('paper-')?'paper':route;const title={search:'Search papers',results:'Search results',graph:'Graph explorer',paper:'Paper detail',experiments:'Experiments',settings:'Search settings'}[page]||'Search state';let content=page==='search'?home():page==='results'?results():page==='graph'?graphPage():page==='paper'?paperPage(Number(route.split('-')[1])):page==='experiments'?experiments():page==='settings'?settings():['empty','error','loading','missing'].includes(page)?statePage(page):home();$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><a class="brand" href="#search">${logo}CiteHop</a><div class="wordmark-sub">Connected research</div><nav class="nav" aria-label="Main navigation">${routes.map(([r,i,n])=>`<a href="#${r}" class="${r===page||r==='search'&&['paper','results','empty','error','loading'].includes(page)?'active':''}" ${r===page?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${i}</span>${n}</a>`).join('')}</nav><div class="sidebar-foot"><b>A database research project</b>Danial & Akshat<br>MariaDB 11.8.9 · LitSearch<br><br>DESIGN REVIEW · V0.1</div></aside><div class="workspace"><header class="topbar"><span>Workspace <span class="muted">/ ${title}</span></span><div class="top-right"><span class="status"><span class="dot"></span>Illustrative prototype</span><strong>LitSearch collection</strong><span class="avatar" aria-label="Research workspace">CH</span></div></header><main class="main" id="main" tabindex="-1">${content}<div class="reviewbar"><b>REVIEW STATES</b>${['search','results','graph','paper-1','experiments','settings','loading','empty','error','missing'].map(r=>`<a href="#${r}">${r.replace('paper-1','paper')}</a>`).join('')}</div><div class="note">Design review draft · All paper titles, authors, graph links, and result provenance shown here are fictional fixtures. Benchmark sizes are expected values from the project handout.</div></main></div></div>`;bind();document.title=`CiteHop · ${title}`}
function toast(t){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.textContent=t;document.body.append(el);setTimeout(()=>el.remove(),5500)}
function bind(){document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>{x.classList.toggle('selected',x===b);x.setAttribute('aria-pressed',x===b)});$('#method-hint').textContent='Selected method: '+mode+' · illustrative results';});$('#search-form')?.addEventListener('submit',e=>{e.preventDefault();query=$('#query').value.trim();if(!query){$('#query').focus();return}location.hash='results';render();});document.querySelectorAll('[data-example]').forEach(b=>b.onclick=()=>{query=b.dataset.example;location.hash='results'});document.querySelectorAll('[data-node]').forEach(n=>{const inspect=()=>{const i=Number(n.dataset.node);$('#node-detail').innerHTML=`<div class="eyebrow">Selected node / fixture ${i+1}</div><h2 style="margin-top:12px">${['Seed paper','Citation neighbor','Graph discovery','Dense retrieval','A. Researcher','Shared reference','Related paper','Related paper','Related paper','Retrieval task'][i]}</h2><p class="muted small" style="margin:15px 0">${[3,9].includes(i)?'Concept node. Inspect the quoted abstract evidence before accepting a relation.':i===4?'Author node. Authorship comes from paper_authors.':'Paper node. Directed citation links connect the visible neighborhood.'}</p><a class="primary" href="#paper-${i===2?1:0}">Inspect sample paper ↗</a>`};n.onclick=inspect;n.onkeydown=e=>{if(['Enter',' '].includes(e.key)){e.preventDefault();inspect()}}});$('#hops')?.addEventListener('change',e=>{const two=e.target.value==='2';document.querySelectorAll('[data-node]').forEach(n=>{n.style.opacity=Number(n.dataset.node)>4&&!two?'.15':'1'});toast('Depth '+e.target.value+' selected. This fixture only previews emphasis; production must query a bounded neighborhood.');});$('#split')?.addEventListener('change',e=>{$('#split-note').textContent=e.target.value==='test'?'Reporting only · frozen configurations · no tuning':'Development only · tuning permitted · seed 42';});$('#settings-form')?.addEventListener('submit',e=>{e.preventDefault();$('#settings-status').textContent='Settings previewed for development. Nothing saved.';});$('#download-plan')?.addEventListener('click',()=>{const blob=new Blob(['config,definition,status\n'+'ABCDEFGHIJKL'.split('').map(c=>`${c},not supplied,not run`).join('\n')],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='citehop-experiment-plan.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});}
window.addEventListener('hashchange',()=>{render();window.scrollTo(0,0);$('#main').focus({preventScroll:true})});render();
</script></body></html>
